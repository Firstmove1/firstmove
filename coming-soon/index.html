<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>First Move — Lacing Up</title>
  <meta name="description" content="First Move Sports — We're lacing up. Be the first to hear the whistle blow." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Roboto:wght@300;400;500&family=Poppins:wght@400;500;600&display=swap"
    rel="stylesheet" />

  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --navy: #0A192F;
      --orange: #fc8b00;
      --white: #FFFFFF;
    }

    html,
    body {
      height: 100%;
      font-family: 'Roboto', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ── FULL PAGE BG ── */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .bg-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    /* dark overlay so text is readable */
    .bg-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg,
          rgba(10, 25, 47, 0.88) 0%,
          rgba(10, 25, 47, 0.65) 50%,
          rgba(10, 25, 47, 0.5) 100%);
    }

    /* ── PAGE ── */
    .page {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      padding: 0 5%;
    }

    /* ── TOPBAR ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 0 20px;
    }

    .logo {
      height: 110px;
      object-fit: contain;
      object-position: left center;
      display: block;
      /* pull logo left to align its visual edge with the headline below */
      margin-left: -12px;
    }

    .domain-chips {
      display: flex;
      gap: 10px;
    }

    .chip {
      font-family: 'Poppins', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      color: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 5px 14px;
      border-radius: 999px;
    }

    /* ── TWO COLUMNS ── */
    .columns {
      display: grid;
      grid-template-columns: 1fr 420px;
      gap: 64px;
      align-items: center;
      padding-bottom: 40px;
    }

    /* ── LEFT: TEXT ── */

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      animation: fade-up 0.8s 0.1s both;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--orange);
      animation: pulse 2s ease-in-out infinite;
    }

    .status-text {
      font-family: 'Poppins', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.45);
    }

    .headline {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(64px, 8vw, 112px);
      font-weight: 700;
      line-height: 0.92;
      text-transform: uppercase;
      color: var(--white);
      margin-bottom: 28px;
      animation: fade-up 0.9s 0.2s both;
      /* slight pull to align with Oswald's natural glyph left edge */
      margin-left: -4px;
    }

    .headline span {
      color: var(--orange);
    }

    .tagline {
      font-size: clamp(15px, 1.3vw, 18px);
      font-weight: 300;
      color: rgba(255, 255, 255, 0.9);
      line-height: 1.8;
      max-width: 460px;
      animation: fade-up 0.9s 0.35s both;
    }

    /* ── RIGHT: FORM CARD ── */
    .form-card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 32px 28px;
      animation: fade-up 0.9s 0.3s both;
    }

    .whistle {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(22px, 2vw, 28px);
      font-weight: 600;
      color: var(--white);
      line-height: 1.2;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .whistle span {
      color: #fc8b00;
    }

    .whistle-sub {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 20px;
    }

    .form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field label {
      font-family: 'Poppins', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.7);
    }

    .field input,
    .field textarea {
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 10px 14px;
      font-family: 'Roboto', sans-serif;
      font-size: 13px;
      color: var(--white);
      background: rgba(255, 255, 255, 0.07);
      outline: none;
      transition: border-color 0.25s, background 0.25s;
      resize: none;
    }

    .field input::placeholder,
    .field textarea::placeholder {
      color: rgba(255, 255, 255, 0.25);
    }

    .field input:focus,
    .field textarea:focus {
      border-color: var(--orange);
      background: rgba(255, 255, 255, 0.12);
    }

    .field textarea {
      height: 72px;
    }

    .submit-btn {
      background: var(--orange);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 13px;
      font-family: 'Oswald', sans-serif;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(242, 101, 34, 0.4);
      margin-top: 4px;
    }

    .submit-btn:hover {
      background: #d94f0e;
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(242, 101, 34, 0.5);
    }

    .success-msg {
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(46, 125, 50, 0.15);
      border: 1px solid rgba(46, 125, 50, 0.4);
      border-radius: 8px;
      padding: 14px 16px;
      color: #81C784;
      font-family: 'Poppins', sans-serif;
      font-size: 15px;
      font-weight: 500;
      margin-top: 8px;
      line-height: 1.5;
    }

    /* ── ANIMATIONS ── */
    @keyframes fade-up {
      from {
        opacity: 0;
        transform: translateY(24px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.3;
        transform: scale(0.7);
      }
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {

      html,
      body {
        overflow: auto;
      }

      .page {
        height: auto;
        min-height: 100vh;
      }

      .columns {
        grid-template-columns: 1fr;
        gap: 40px;
        padding-bottom: 60px;
      }

      .form-card {
        max-width: 100%;
      }

      .bg-overlay {
        background: linear-gradient(to bottom, rgba(10, 25, 47, 0.92) 0%, rgba(10, 25, 47, 0.85) 100%);
      }
    }

    @media (max-width: 480px) {
      .form-row {
        grid-template-columns: 1fr;
      }

      .domain-chips {
        display: none;
      }
    }
  </style>
</head>

<body>

  <!-- Full-page background -->
  <div class="bg">
    <img class="bg-img" src="kids-sports.jpg" alt="Kids playing sports" />
    <div class="bg-overlay"></div>
  </div>

  <div class="page">

    <!-- Top bar -->
    <div class="topbar">
      <img src="Transparent_FirstMove_Logo_White.png" alt="FirstMove" class="logo" />
    </div>

    <!-- Content columns -->
    <div class="columns">

      <!-- LEFT: Brand content -->
      <div class="left">

        <h1 class="headline">
          Lacing<br /><span>Up.</span>
        </h1>

        <p class="tagline">
          We're building a routine to transform the way you discover, learn, and experience sports, like never before.
        </p>
      </div>

      <!-- RIGHT: Form card -->
      <div class="form-card">
        <h2 class="whistle">
          Be the first to hear<br />the <span>Whistle Blow</span>
        </h2>
        <p class="whistle-sub">Drop your details — we'll reach out before the opening bell.</p>

        <form class="form" id="contact-form" onsubmit="handleSubmit(event)">
          <div class="form-row">
            <div class="field">
              <label>Name</label>
              <input type="text" placeholder="Your name" required />
            </div>
            <div class="field">
              <label>Number</label>
              <input type="tel" placeholder="+91 00000 00000" required />
            </div>
          </div>

          <div class="field">
            <label>Email</label>
            <input type="email" placeholder="your@email.com" required />
          </div>

          <div class="field">
            <label>Your Query</label>
            <textarea placeholder="What sport are you interested in?"></textarea>
          </div>

          <button type="submit" id="submit-btn" class="submit-btn">Mark. Set. Go! 🏁</button>

          <div class="success-msg" id="success-msg">
            ✅ &nbsp;Thanks for joining! We'll drop you an update very soon.
          </div>
        </form>
      </div>

    </div>
  </div>

  <script>
    const SHEET_URL = 'https://script.google.com/macros/s/AKfycby4BofGkNulIud-LZE6HeavUkCiSNKtl4i6SkqsgDtgbZyAt_9LsG2pe_g2gkKYGFZRDA/exec';

    function handleSubmit(e) {
      e.preventDefault();
      const form = document.getElementById('contact-form');
      const btn = document.getElementById('submit-btn');
      const success = document.getElementById('success-msg');

      const data = {
        name: form.querySelector('input[type="text"]').value,
        number: form.querySelector('input[type="tel"]').value,
        email: form.querySelector('input[type="email"]').value,
        query: form.querySelector('textarea').value
      };

      btn.textContent = 'Sending... ⏳';
      btn.disabled = true;

      fetch(SHEET_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
        .then(() => {
          success.style.display = 'flex';
          form.querySelectorAll('input, textarea').forEach(el => el.value = '');
          btn.textContent = 'Mark. Set. Go! 🏁';
          btn.disabled = false;
        })
        .catch(() => {
          success.style.display = 'flex';
          btn.textContent = 'Mark. Set. Go! 🏁';
          btn.disabled = false;
        });
    }
  </script>

</body>

</html>
