<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>First Move — Coming Soon</title>
  <meta name="description" content="First Move Sports — Coming Soon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: #0A192F;
      font-family: 'Poppins', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
    }

    .logo {
      width: 220px;
      opacity: 0;
      animation: fade-in 1s cubic-bezier(0.16,1,0.3,1) 0.3s forwards;
    }

    .status {
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      opacity: 0;
      animation: fade-in 1s cubic-bezier(0.16,1,0.3,1) 0.7s forwards;
    }

    .dot {
      display: inline-block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #F26522;
      margin-right: 8px;
      vertical-align: middle;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <main class="page">
    <img src="Logo.png" alt="First Move" class="logo" />
    <p class="status">
      <span class="dot"></span>Website Under Development
    </p>
  </main>
</body>
</html>
